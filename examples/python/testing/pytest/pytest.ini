[pytest]
minversion = 9.0
testpaths = .
python_files = test_*.py
addopts = --strict-markers --tb=short
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    slow: длительные тесты
    integration: проверки нескольких компонентов
    unit: изолированные проверки поведения
