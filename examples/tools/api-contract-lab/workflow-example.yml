name: API contract lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-contract-lab
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the API contract
        run: docker compose run --build --rm client
      - name: Show service logs
        if: ${{ failure() }}
        run: docker compose logs --tail 50 app postgres
      - name: Remove the lab containers and database volume
        if: ${{ always() }}
        run: docker compose down --volumes
