services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: books_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only-password
    volumes:
      - books-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-books.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lab", "-d", "books_lab"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      PGHOST: postgres
      PGDATABASE: books_lab
      PGUSER: lab
      PGPASSWORD: lab-only-password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 2s
      timeout: 3s
      retries: 20

  client:
    build:
      context: .
      target: client
    depends_on:
      app:
        condition: service_healthy

volumes:
  books-data:
