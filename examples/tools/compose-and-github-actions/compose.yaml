services:
  app:
    build: .
    environment:
      PGHOST: postgres
      PGDATABASE: compose_lab
      PGUSER: lab
      PGPASSWORD: lab-only-password
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 5s
      timeout: 6s
      retries: 6

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: compose_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only-password
    volumes:
      - lab-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lab", "-d", "compose_lab"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  lab-data:
