name: PostgreSQL integration test

on:
  workflow_dispatch:
    inputs:
      fail_test:
        description: Make the test fail on purpose
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: compose_lab
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lab -d compose_lab"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run database test
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGDATABASE: compose_lab
          PGUSER: lab
          PGPASSWORD: lab-only-password
          LAB_FORCE_FAILURE: ${{ inputs.fail_test && '1' || '0' }}
        run: python -m unittest -v
