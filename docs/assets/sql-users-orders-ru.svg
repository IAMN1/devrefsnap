<svg xmlns="http://www.w3.org/2000/svg" width="312" height="342" viewBox="0 0 312 342" role="img" aria-labelledby="title desc">
  <title id="title">Пользователи и заказы</title>
  <desc id="desc">У каждого заказа один пользователь, на которого ссылается user_id. У пользователя может быть любое число заказов, включая ноль. У заказа свой первичный ключ id.</desc>
