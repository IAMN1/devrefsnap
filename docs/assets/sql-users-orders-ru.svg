    <text x="14" y="27" text-anchor="start" font-family="ui-monospace, monospace" font-weight="600">sql_users</text>
    <path d="M5 37h302" stroke="#bdc9d5"/>
    <text x="14" y="59" text-anchor="start" font-family="ui-monospace, monospace">id</text>
    <text x="165" y="59" text-anchor="start">integer</text>
    <text x="303" y="59" text-anchor="end" font-weight="600" fill="#24523d">PK</text>
    <path d="M5 68h302" stroke="#bdc9d5"/>
    <text x="14" y="90" text-anchor="start" font-family="ui-monospace, monospace">name</text>
    <text x="165" y="90" text-anchor="start">varchar(80)</text>
    <text x="303" y="90" text-anchor="end" font-weight="600" fill="#24523d">UK</text>
    <path d="M32 100v24 M22 108h20 M22 115h20" fill="none" stroke="#405770" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M32 124v30" fill="none" stroke="#405770" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/>
    <circle cx="32" cy="159" r="6" fill="#fff" stroke="#405770" stroke-width="2"/>
    <path d="M32 165v14 M20 179l12-12 12 12" fill="none" stroke="#405770" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="53" y="126" text-anchor="start">Ровно один пользователь</text>
    <text x="53" y="162" text-anchor="start">Ноль или больше заказов</text>
    <rect x="4" y="180" width="304" height="158" rx="7" fill="#fff" stroke="#8497aa"/>
    <path d="M5 187q0-6 6-6h290q6 0 6 6v26H5z" fill="#eaf1fd"/>
