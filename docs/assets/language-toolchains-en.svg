<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-labelledby="title desc">
  <title id="title">From source code to execution</title>
  <desc id="desc">C and C++ compile the source into an object file, link the executable, and run it. The .NET SDK restores C# project dependencies, builds a DLL with IL, and starts the program in the CLR.</desc>
  <rect width="960" height="558" rx="14" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#222c3d">
  <text x="24" y="47" font-size="34" font-weight="700">From source code to execution</text>
  <text x="24" y="78" font-size="19" fill="#39465b">Typical console application build</text>
  <g transform="translate(24 110)">
    <rect width="448" height="424" rx="14" fill="#eff3fe"/>
    <text x="22" y="34" font-size="24" font-weight="700" fill="#354caa">C / C++</text>
    <rect x="20" y="52" width="408" height="64" rx="8" fill="#fff" stroke="#aab9ea"/>
    <text x="40" y="78" font-size="20" font-weight="600">Source code</text>
    <text x="40" y="101" font-size="17" fill="#39465b">.c or .cpp</text>
    <path d="M41 117v24m-5-6 5 6 5-6" fill="none" stroke="#354caa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="136" font-size="15" font-weight="600" fill="#354caa">Compile</text>
    <rect x="20" y="146" width="408" height="64" rx="8" fill="#fff" stroke="#aab9ea"/>
    <text x="40" y="172" font-size="20" font-weight="600">Object file</text>
    <text x="40" y="195" font-size="17" fill="#39465b">.o or .obj</text>
    <path d="M41 211v24m-5-6 5 6 5-6" fill="none" stroke="#354caa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="230" font-size="15" font-weight="600" fill="#354caa">Link</text>
    <rect x="20" y="240" width="408" height="64" rx="8" fill="#fff" stroke="#aab9ea"/>
    <text x="40" y="266" font-size="20" font-weight="600">Executable</text>
    <text x="40" y="289" font-size="17" fill="#39465b">Code for the target platform</text>
    <path d="M41 305v24m-5-6 5 6 5-6" fill="none" stroke="#354caa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="324" font-size="15" font-weight="600" fill="#354caa">Run</text>
    <rect x="20" y="334" width="408" height="64" rx="8" fill="#fff" stroke="#aab9ea"/>
    <text x="40" y="360" font-size="20" font-weight="600">Process</text>
    <text x="40" y="383" font-size="17" fill="#39465b">Code runs on the OS</text>
  </g>
  <g transform="translate(488 110)">
    <rect width="448" height="424" rx="14" fill="#edf8f4"/>
    <text x="22" y="34" font-size="24" font-weight="700" fill="#0f6d5a">C# / .NET</text>
    <rect x="20" y="52" width="408" height="64" rx="8" fill="#fff" stroke="#a5c9bd"/>
    <text x="40" y="78" font-size="20" font-weight="600">Project</text>
    <text x="40" y="101" font-size="17" fill="#39465b">.cs and .csproj</text>
    <path d="M41 117v24m-5-6 5 6 5-6" fill="none" stroke="#0f6d5a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="136" font-size="15" font-weight="600" fill="#0f6d5a">dotnet restore</text>
    <rect x="20" y="146" width="408" height="64" rx="8" fill="#fff" stroke="#a5c9bd"/>
    <text x="40" y="172" font-size="20" font-weight="600">Project dependencies</text>
    <text x="40" y="195" font-size="17" fill="#39465b">Target framework and packages</text>
    <path d="M41 211v24m-5-6 5 6 5-6" fill="none" stroke="#0f6d5a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="230" font-size="15" font-weight="600" fill="#0f6d5a">dotnet build</text>
    <rect x="20" y="240" width="408" height="64" rx="8" fill="#fff" stroke="#a5c9bd"/>
    <text x="40" y="266" font-size="20" font-weight="600">.NET assembly</text>
    <text x="40" y="289" font-size="17" fill="#39465b">.dll with IL and metadata</text>
    <path d="M41 305v24m-5-6 5 6 5-6" fill="none" stroke="#0f6d5a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="56" y="324" font-size="15" font-weight="600" fill="#0f6d5a">dotnet run</text>
    <rect x="20" y="334" width="408" height="64" rx="8" fill="#fff" stroke="#a5c9bd"/>
    <text x="40" y="360" font-size="20" font-weight="600">.NET process</text>
    <text x="40" y="383" font-size="17" fill="#39465b">CLR runs the program</text>
  </g>
  </g>
</svg>
