<svg xmlns="http://www.w3.org/2000/svg" width="320" height="449" viewBox="0 0 320 449" role="img" aria-labelledby="title desc">
  <title id="title">From source to a running program</title>
  <desc id="desc">C and C++ compile source and link an executable. For .NET, dotnet build creates the application files. dotnet basics.dll runs the built application.</desc>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#18273a">
    <rect x="1" y="1" width="318" height="242" rx="12" fill="#eff3fe" stroke="#aab9ea"/>
    <text x="16" y="29" font-size="20" font-weight="700" fill="#354caa">C / C++</text>
    <g font-weight="600">
      <text x="46" y="60">Source .c or .cpp</text>
      <text x="46" y="113">Object file .o or .obj</text>
      <text x="46" y="166">Executable file</text>
      <text x="46" y="219">Operating system process</text>
    </g>
    <path d="M24 68v30m-5-6 5 6 5-6 M24 121v30m-5-6 5 6 5-6 M24 174v30m-5-6 5 6 5-6"
          fill="none" stroke="#354caa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#354caa">
      <text x="46" y="86">Compile</text>
      <text x="46" y="139">Link</text>
      <text x="46" y="192">Run executable</text>
    </g>
    <g transform="translate(0 258)">
      <rect x="1" y="1" width="318" height="189" rx="12" fill="#edf8f4" stroke="#a5c9bd"/>
      <text x="16" y="29" font-size="20" font-weight="700" fill="#0f6d5a">C# / .NET</text>
      <g font-weight="600">
        <text x="46" y="60">Program.cs + basics.csproj</text>
        <text x="46" y="113">DLL and application files</text>
        <text x="46" y="166">.NET process</text>
      </g>
      <path d="M24 68v30m-5-6 5 6 5-6 M24 121v30m-5-6 5 6 5-6"
            fill="none" stroke="#0f6d5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#0f6d5a" font-family="ui-monospace, monospace">
        <text x="46" y="86">dotnet build</text>
        <text x="46" y="139">dotnet basics.dll</text>
      </g>
    </g>
  </g>
</svg>
